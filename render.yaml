# ==============================================================================
# FLOWMIND AI — Official Render Blueprint Configuration
# Declares the Full-Stack Web Platform and Render Workflows Worker Service
# Deploy with 1-click via Render Dashboard: "New" -> "Blueprint"
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. FLOWMIND AI Web Service (Frontend + Backend API Gateway)
  # ----------------------------------------------------------------------------
  - type: web
    name: flowmind-ai-platform
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/render/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: RENDER_WORKFLOW_SLUG
        value: flowmind-workflows
      - key: RENDER_TASKS_URL
        value: https://api.render.com/v1
      - key: RENDER_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # ----------------------------------------------------------------------------
  # 2. FLOWMIND AI Render Workflows Dedicated Worker
  # ----------------------------------------------------------------------------
  - type: worker
    name: flowmind-workflows-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_WORKFLOW_SLUG
        value: flowmind-workflows
      - key: RENDER_TASKS_URL
        value: https://api.render.com/v1
      - key: RENDER_API_KEY
        sync: false
