# ==============================================================================
# FLOWMIND AI — 100% Free Plan Render Blueprint Configuration
# Deploys as a Free Web Service on Render with zero credit card required.
# ==============================================================================

version: "1"

services:
  - type: web
    name: flowmind
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/render/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: RENDER_WORKFLOW_SLUG
        value: flowmind-workflows
      - key: RENDER_TASKS_URL
        value: https://api.render.com/v1
      - key: RENDER_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
